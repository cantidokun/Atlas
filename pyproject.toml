[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Atlas AI-assisted Blender production platform"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["qwen*", "live*", "planning*", "controller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "blender: requires the self-hosted Blender integration runner",
]
