name: Wave 12 C1 Patch Runner

on:
  push:
    branches: [feat/blender-wave12-reference-integrity]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: contain Wave 12 planner field access'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/blender-wave12-reference-integrity
          fetch-depth: 0

      - name: Patch planner boundary and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('planning/blender/parent_cycle.py')
          s = p.read_text(encoding='utf-8')

          old = '''def target_is_in_parent_cycle(scene_model: Any, target_object_id: str) -> bool:\n    return bool(_cycle_from_target(scene_model, target_object_id))\n'''
          new = '''def target_is_in_parent_cycle(scene_model: Any, target_object_id: str) -> bool:\n    try:\n        return bool(_cycle_from_target(scene_model, target_object_id))\n    except ParentCycleError:\n        raise\n    except Exception as exc:\n        raise ParentCycleError(\n            "scene traversal or parent access failed", "SCENE_VALIDATION_FAILED"\n        ) from exc\n'''
          if old not in s:
              raise SystemExit('target_is_in_parent_cycle patch target not found')
          s = s.replace(old, new, 1)

          start = s.index('def plan_parent_cycle_correction(')
          end = s.index('\n\ndef verify_parent_cycle_authorization(', start)
          old_block = s[start:end]
          new_block = '''def plan_parent_cycle_correction(\n    scene_model: Any,\n    source_report_digest: str,\n    *,\n    target_object_id: str,\n    expected_parent_id: str,\n) -> Mapping[str, Any]:\n    try:\n        _validate_digest(source_report_digest, "source report digest")\n        if type(target_object_id) is not str or not target_object_id:\n            raise ParentCycleError("target object id is required", "TARGET_OBJECT_INVALID")\n        if type(expected_parent_id) is not str or not expected_parent_id:\n            raise ParentCycleError(\n                "expected parent id is required", "EXPECTED_PARENT_INVALID"\n            )\n        by_id = _index_objects(scene_model)\n        target = by_id.get(target_object_id)\n        if target is None:\n            raise ParentCycleError(\n                "target object must resolve exactly once", "TARGET_OBJECT_NOT_FOUND"\n            )\n        actual_parent = _parent_id(target)\n        if actual_parent != expected_parent_id:\n            raise ParentCycleError(\n                "target does not present the expected parent edge",\n                "EXPECTED_PARENT_MISMATCH",\n            )\n        if expected_parent_id not in by_id:\n            raise ParentCycleError(\n                "expected parent identifier is dangling; use Wave 4", "PARENT_IS_DANGLING"\n            )\n        cycle = _cycle_from_index(by_id, target_object_id)\n        if not cycle:\n            raise ParentCycleError(\n                "target is not a member of a parent cycle", "CYCLE_NOT_FOUND"\n            )\n        if expected_parent_id not in cycle:\n            raise ParentCycleError(\n                "target parent is not the cycle edge selected by the plan",\n                "PARENT_NOT_IN_CYCLE",\n            )\n        return _make_plan(\n            target_object_id=target_object_id,\n            expected_parent_id=expected_parent_id,\n            source_report_digest=source_report_digest,\n        )\n    except ParentCycleError:\n        raise\n    except Exception as exc:\n        raise ParentCycleError(\n            "scene traversal or field access failed", "SCENE_VALIDATION_FAILED"\n        ) from exc\n'''
          s = s[:start] + new_block + s[end:]
          p.write_text(s, encoding='utf-8')

          q = Path('tests/test_blender_wave12_boundary_hardening.py')
          t = q.read_text(encoding='utf-8')
          needle = '\ndef test_canonical_wave12_scene_digest_is_publicly_available():\n'
          if needle not in t:
              raise SystemExit('test insertion point not found')
          insert = '''\n\nclass StatefulParentMapping(dict):\n    def __init__(self, values, fail_on_read):\n        super().__init__(values)\n        self._parent_reads = 0\n        self._fail_on_read = fail_on_read\n\n    def get(self, key, default=None):\n        if key == "parent_object_id":\n            self._parent_reads += 1\n            if self._parent_reads == self._fail_on_read:\n                raise RuntimeError("stateful parent read boom")\n        return super().get(key, default)\n\n\ndef test_planner_contains_stateful_parent_accessor_failure_after_index():\n    scene = {\n        "objects": [\n            StatefulParentMapping(\n                {"object_id": "a", "parent_object_id": "b"}, fail_on_read=2\n            ),\n            {"object_id": "b", "parent_object_id": "a"},\n        ]\n    }\n    with pytest.raises(ParentCycleError) as exc:\n        plan_parent_cycle_correction(\n            scene,\n            scene_report_digest(scene),\n            target_object_id="a",\n            expected_parent_id="b",\n        )\n    assert exc.value.failure_code == "SCENE_VALIDATION_FAILED"\n\n\ndef test_cycle_query_contains_stateful_parent_accessor_failure():\n    from planning.blender.parent_cycle import target_is_in_parent_cycle\n\n    scene = {\n        "objects": [\n            StatefulParentMapping(\n                {"object_id": "a", "parent_object_id": "b"}, fail_on_read=2\n            ),\n            {"object_id": "b", "parent_object_id": "a"},\n        ]\n    }\n    with pytest.raises(ParentCycleError) as exc:\n        target_is_in_parent_cycle(scene, "a")\n    assert exc.value.failure_code == "SCENE_VALIDATION_FAILED"\n'''
          q.write_text(t.replace(needle, insert + needle), encoding='utf-8')
          PY

      - name: Run focused Wave 12 regression
        run: python -m pytest -q tests/test_blender_wave12_boundary_hardening.py tests/test_blender_wave12_parent_cycle.py

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planning/blender/parent_cycle.py tests/test_blender_wave12_boundary_hardening.py
          git commit -m "fix: contain Wave 12 planner field access"
          git push origin HEAD:feat/blender-wave12-reference-integrity

      - name: Remove temporary runner
        run: |
          git rm .github/workflows/wave12_c1_patch.yml
          git commit -m "chore: remove temporary Wave 12 patch runner"
          git push origin HEAD:feat/blender-wave12-reference-integrity
