name: Live Object Movement Regression

on:
  push:
    branches:
      - main
      - feat/blender-adapter-work
      - feat/blender-coordinator-result-integrity-final
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-live-object-movement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-object-movement:
    name: live object movement (${{ matrix.case }})
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing
    strategy:
      fail-fast: false
      matrix:
        case:
          - already-correct
          - incorrect
    steps:
      - name: Check out triggering Atlas revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show runner environment
        shell: cmd
        run: |
          echo Runner name: %RUNNER_NAME%
          echo Workspace: %GITHUB_WORKSPACE%
          cd
      - name: Provision deterministic movement fixtures
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "python .\scripts\provision_object_move_fixtures.py"
      - name: Run live Qwen object movement task
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "python .\live_qwen_object_move.py --case '${{ matrix.case }}'"
