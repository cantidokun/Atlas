name: Atlas Temporal Live Blender Gate

on:
  push:
    branches:
      - feat/temporal-observation-state-delta-v1-core-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-temporal-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  temporal-live-blender:
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify pinned Blender runtime
        shell: cmd
        run: |
          "C:\Program Files\Blender Foundation\Blender 4.4\blender.exe" --version

      - name: Install pytest
        shell: cmd
        run: |
          python -m pip install --upgrade pytest

      - name: Run Temporal live Blender gate
        shell: cmd
        env:
          ATLAS_RUN_LIVE_BLENDER: "1"
        run: |
          python -m pytest -q tests/test_live_blender_temporal_v1.py -s > temporal-live-gate.log 2>&1
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload Temporal live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-live-blender-evidence
          path: temporal-live-gate.log
          if-no-files-found: warn
          retention-days: 14

  temporal-correction-integration-live-blender:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify pinned Blender runtime
        shell: cmd
        run: |
          "C:\Program Files\Blender Foundation\Blender 4.4\blender.exe" --version

      - name: Install pytest
        shell: cmd
        run: |
          python -m pip install --upgrade pytest

      - name: Run Temporal Correction Integration live gate
        shell: cmd
        env:
          ATLAS_RUN_LIVE_BLENDER: "1"
          ATLAS_BLENDER_EXECUTABLE: "C:\Program Files\Blender Foundation\Blender 4.4\blender.exe"
        run: |
          python -m pytest -q tests/test_live_blender_correction_execution_bridge.py -s > temporal-correction-live-gate.log 2>&1
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload Temporal Correction live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-correction-integration-live-blender-evidence
          path: temporal-correction-live-gate.log
          if-no-files-found: warn
          retention-days: 14
