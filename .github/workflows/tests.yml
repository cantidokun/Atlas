name: Atlas Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests

      - name: Run offline test suite
        run: python -m pytest -q -m "not integration"

      - name: Run M13.7 repository benchmark
        if: matrix.python-version == '3.11'
        run: |
          python -m planning.repository_intelligence.m13_benchmark . --output /tmp/m13.7-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/m13.7-benchmark.json').read_text(encoding='utf-8'))
          aggregate = report['aggregate']
          print('M13.7 benchmark aggregate:')
          for key in ('cases', 'precision', 'recall', 'f1', 'avg_budget_utilization', 'required_missing', 'truncated_files'):
              print(f'{key}={aggregate[key]}')
          print(f"deterministic={all(item['deterministic'] for item in report['cases'])}")
          print(f"production_execution_invoked={report['production_execution_invoked']}")
          print(f"model_provider_invoked={report['model_provider_invoked']}")
          PY

  temporal-correction-live-blender:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'design/temporal-correction-integration-v3'
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify pinned Blender runtime
        shell: cmd
        run: |
          "C:\Program Files\Blender Foundation\Blender 4.4\blender.exe" --version

      - name: Install pytest
        shell: cmd
        run: |
          python -m pip install --upgrade pytest

      - name: Run Temporal Correction Integration live gate
        shell: cmd
        env:
          ATLAS_RUN_LIVE_BLENDER: "1"
          ATLAS_BLENDER_EXECUTABLE: "C:\Program Files\Blender Foundation\Blender 4.4\blender.exe"
        run: |
          python -m pytest -q tests/test_live_blender_correction_execution_bridge.py -s > temporal-correction-live-gate.log 2>&1
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload Temporal Correction live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-correction-integration-live-blender-evidence
          path: temporal-correction-live-gate.log
          if-no-files-found: warn
          retention-days: 14
