name: Live Object Delete Regression

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-live-object-delete-main
  cancel-in-progress: true

jobs:
  live-object-delete:
    name: live object delete (${{ matrix.case }})
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing
    strategy:
      fail-fast: false
      matrix:
        case:
          - already-correct
          - incorrect
    steps:
      - name: Check out triggering Atlas revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show runner environment
        shell: cmd
        run: |
          echo Runner name: %RUNNER_NAME%
          echo Workspace: %GITHUB_WORKSPACE%
          cd
      - name: Provision deterministic object delete fixtures
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "python .\scripts\provision_object_delete_fixtures.py"
      - name: Run live Qwen object delete task
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "python .\live_qwen_object_delete.py --case '${{ matrix.case }}'"
