name: Atlas Correction Execution Bridge Live Blender Gate

on:
  push:
    branches:
      - feat/blender-correction-execution-bridge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-correction-bridge-live-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  correction-bridge-live-blender:
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify pinned Blender runtime
        shell: cmd
        run: |
          "C:\Program Files\Blender Foundation\Blender 4.4\blender.exe" --version

      - name: Install pytest
        shell: cmd
        run: |
          python -m pip install --upgrade pytest

      - name: Run Correction Execution Bridge live gate
        shell: cmd
        env:
          ATLAS_RUN_LIVE_BLENDER: "1"
          ATLAS_BLENDER_EXECUTABLE: "C:\Program Files\Blender Foundation\Blender 4.4\blender.exe"
        run: |
          python -m pytest -q tests/test_live_blender_correction_execution_bridge.py -s > correction-bridge-live-gate.log 2>&1
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload Correction Bridge live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correction-bridge-live-blender-evidence
          path: correction-bridge-live-gate.log
          if-no-files-found: warn
          retention-days: 14
