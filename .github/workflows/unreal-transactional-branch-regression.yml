name: Unreal Transactional Branch Regression

on:
  push:
    branches:
      - feat/unreal-composite-production-operation
  workflow_dispatch:
    inputs:
      ref:
        description: "Atlas ref to test"
        required: true
        default: "feat/unreal-composite-production-operation"

permissions:
  contents: read

concurrency:
  group: atlas-unreal-transactional-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Transactional Python regression
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Verify runner identity
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo Runner OS: %RUNNER_OS%
          ver
          if /I not "%RUNNER_OS%"=="Windows" exit /B 1
      - name: Run transactional regression suite
        shell: cmd
        run: python -m pytest tests/test_unreal_plan_executor.py tests/test_unreal_production_recovery.py tests/test_unreal_transactional_executor.py -q
      - name: Run real Unreal Blueprint integration suite
        shell: cmd
        run: python -m pytest tests/test_unreal_blueprint_real_integration.py -q -rs
