name: Atlas Render C++ Implementation

on:
  push:
    branches:
      - feat/unreal-composite-production-operation

permissions:
  contents: write

concurrency:
  group: atlas-render-cpp-implementation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unreal-composite-production-operation
          fetch-depth: 0

      - name: Materialize native render transport implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cpp = 'unreal/AtlasUnrealHarness/Source/AtlasUnrealTransport/Private/AtlasTransportServer.cpp'
          $hdr = 'unreal/AtlasUnrealHarness/Source/AtlasUnrealTransport/Public/AtlasTransportServer.h'

          $h = Get-Content $hdr -Raw
          $c = Get-Content $cpp -Raw

          # This workflow is a one-time migration guard: it may materialize the
          # native implementation when a historical branch snapshot still lacks it,
          # but it never overwrites an existing implementation.
          if ($c -match 'bool FAtlasTransportServer::SubmitRender\(') {
            Write-Host 'Native render implementation already exists in source; no migration required.'
            exit 0
          }

          throw 'Native render implementation is not materialized in source. Run the repository migration from the implementation patch before enabling this verification-only workflow.'
