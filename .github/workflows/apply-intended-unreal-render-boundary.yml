name: Apply intended Unreal render production boundary

on:
  push:
    branches:
      - feat/unreal-composite-production-operation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unreal-composite-production-operation
          fetch-depth: 0
      - name: Revert temporary transport implementation
        run: |
          git revert --no-edit b8bd68ce15876524eedfa72430a17891ff5e4842 || true
      - name: Apply repository render boundary migration
        run: python tools/apply_unreal_render_production_boundary.py
      - name: Commit intended render boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planning unreal
          git diff --cached --quiet && exit 0
          git commit -m "Implement intended Unreal render production boundary"
          git push origin HEAD:feat/unreal-composite-production-operation
