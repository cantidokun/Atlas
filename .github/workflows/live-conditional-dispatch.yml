name: Live Conditional Atlas Test

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Conditional Blender scenario"
        required: true
        type: choice
        options:
          - already-correct
          - incorrect

permissions:
  contents: read

jobs:
  live-conditional:
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing

    steps:
      - name: Check out tested Atlas branch
        uses: actions/checkout@v4
        with:
          ref: ai/level2-runner-setup

      - name: Show runner environment
        shell: cmd
        run: |
          echo Runner name: %RUNNER_NAME%
          echo Workspace: %GITHUB_WORKSPACE%
          cd

      - name: Provision local Blender fixture
        shell: powershell
        run: |
          $source = "C:\Users\Gavin's PC\Desktop\Atlas\goalpost_test.blend"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Runner-local Atlas fixture not found: $source"
          }
          Copy-Item -LiteralPath $source -Destination ".\goalpost_test.blend" -Force
          Write-Host "Provisioned goalpost_test.blend from the runner's local Atlas fixture."

      - name: Run live conditional Blender harness
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "python .\live_qwen_conditional_loop.py --case '${{ inputs.case }}'"
