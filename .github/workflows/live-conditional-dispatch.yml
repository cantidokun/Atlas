name: Live Conditional Atlas Test

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Conditional Blender scenario"
        required: true
        type: choice
        options:
          - already-correct
          - incorrect

permissions:
  contents: read

jobs:
  live-conditional:
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing

    steps:
      - name: Check out tested Atlas branch
        uses: actions/checkout@v4
        with:
          ref: ai/level2-runner-setup

      - name: Show runner environment
        shell: cmd
        run: |
          echo Runner name: %RUNNER_NAME%
          echo Workspace: %GITHUB_WORKSPACE%
          cd

      - name: Provision local Blender fixture
        shell: cmd
        run: |
          if not exist "C:\Users\Gavin's PC\Desktop\Atlas\goalpost_test.blend" exit /b 1
          copy /Y "C:\Users\Gavin's PC\Desktop\Atlas\goalpost_test.blend" "C:\Users\Gavin's PC\Desktop\Atlas\goalpost_test_CONDITIONAL_CORRECT.blend"
          copy /Y "C:\Users\Gavin's PC\Desktop\Atlas\goalpost_test.blend" "C:\Users\Gavin's PC\Desktop\Atlas\goalpost_test_CONDITIONAL_INCORRECT.blend"
          if errorlevel 1 exit /b 1
          echo Provisioned conditional Blender fixtures in the Atlas tool directory.

      - name: Run live conditional Blender harness
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "python .\live_qwen_conditional_loop.py --case '${{ inputs.case }}'"
