name: Live Object Rename Continuation Regression

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-live-rename-continuation-main
  cancel-in-progress: true

jobs:
  live-rename-continuation:
    name: live rename continuation (${{ matrix.case }})
    runs-on: [self-hosted, windows, local-win]
    environment: local-testing
    strategy:
      fail-fast: false
      matrix:
        case:
          - already-correct
          - incorrect
          - tampered-context
    steps:
      - name: Check out triggering Atlas revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show runner environment
        shell: cmd
        run: |
          echo Runner name: %RUNNER_NAME%
          echo Workspace: %GITHUB_WORKSPACE%
          cd
      - name: Provision deterministic rename fixtures
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "python .\scripts\provision_object_rename_fixtures.py"
      - name: Run live Blender rename continuation harness
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "python .\live_qwen_object_rename_continuation.py --case '${{ matrix.case }}'"
